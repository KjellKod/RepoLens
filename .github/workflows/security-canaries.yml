name: Security canaries

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-canaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIP_NO_INDEX: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      REPOLENS_NAME_HYGIENE_MODE: "offline"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install offline test dependencies
        run: |
          python -m pip install \
            --no-index \
            --find-links tools/wheelhouse/security-canaries \
            --require-hashes \
            -r requirements/security-canaries.lock
      - name: Run security canaries
        run: python scripts/security_canary_gate.py
