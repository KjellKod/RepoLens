name: Security canaries

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-canaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIP_NO_INDEX: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      REPOLENS_NAME_HYGIENE_MODE: "offline"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"
      - name: Install offline test dependencies
        run: |
          python -m pip install \
            --no-index \
            --find-links tools/wheelhouse/security-canaries \
            --require-hashes \
            -r requirements/security-canaries.lock
      - name: Run security canaries
        run: python scripts/security_canary_gate.py
