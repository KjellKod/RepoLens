name: Live Smoke

on:
  schedule:
    - cron: "37 9 * * 1"
  workflow_dispatch:
    inputs:
      target_owner:
        description: "Runtime owner or organization to inspect"
        required: false
        type: string
      target_repository:
        description: "Runtime repository name for dogfood target"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: live-smoke-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  live-smoke:
    if: github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout trusted default-branch workflow code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install locked dev tools
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Run live smoke
        env:
          RPL_LIVE_OWNER: ${{ inputs.target_owner || vars.RPL_LIVE_OWNER || github.repository_owner }}
          RPL_LIVE_REPOSITORY: ${{ inputs.target_repository || github.event.repository.name }}
          RPL_LIVE_TOKEN: ${{ secrets.RPL_LIVE_TOKEN || github.token }}
        run: python scripts/ci/live_smoke.py --mode r0
