name: F5 Policy Engine

# Triggers on both PRs and pushes. Test *execution* is offline and deterministic
# (no network, no subprocess, no filesystem writes); only the dependency install
# step below uses the network, like any CI.
on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  f5-policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies (networked)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]

      - name: Run F5 unit, canary, and name-hygiene suite (offline, deterministic)
        env:
          REPOLENS_FORBIDDEN_NAMES: ${{ vars.REPOLENS_FORBIDDEN_NAMES }}
        run: |
          python -m pytest tests/policy

      - name: Redundant offline name-hygiene grep guard
        env:
          REPOLENS_FORBIDDEN_NAMES: ${{ vars.REPOLENS_FORBIDDEN_NAMES }}
        run: |
          set -uo pipefail
          guard_status=0
          IFS=',' read -ra tokens <<< "${REPOLENS_FORBIDDEN_NAMES}"
          token_index=0
          for token in "${tokens[@]}"; do
            token_index=$((token_index + 1))
            token="$(printf '%s' "${token}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "${token}" ] && continue
            matches="$(grep -RIl -i --fixed-strings -e "${token}" \
                pyproject.toml src/repolens/policy tests/policy .github/workflows/f5-policy.yml || true)"
            if [ -n "${matches}" ]; then
              match_count="$(printf '%s\n' "${matches}" | sed '/^$/d' | wc -l | tr -d ' ')"
              match_paths="$(printf '%s\n' "${matches}" | sed '/^$/d' | paste -sd ', ' -)"
              echo "::error::forbidden runtime identifier #${token_index} found in ${match_count} F5 file(s): ${match_paths}"
              guard_status=1
            fi
          done
          exit "${guard_status}"
