name: Offline CI

# The single offline PR gate. Security canaries run in their own offline workflow
# (security-canaries.yml); codex-ci-review.yml is advisory and live-smoke.yml is
# scheduled. There are no per-component workflows.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  offline-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install package and locked dev tools
        run: |
          python -m pip install -e '.[test]'
          python -m pip install --require-hashes -r requirements-dev.txt

      - name: Compile Python files
        run: python -m compileall src/repolens tests

      - name: Ruff format
        run: python -m ruff format --check .

      - name: Ruff lint
        run: python -m ruff check .

      - name: Unit tests
        run: python -m pytest tests/unit

      - name: Integration tests
        run: python -m pytest tests/integration tests/e2e tests/canaries

      - name: Policy (F5) tests
        run: python -m pytest tests/policy

      - name: Bootstrap (F4) tests
        run: python -m pytest tests/bootstrap

      - name: Security canaries
        run: python scripts/security_canary_gate.py

      - name: Name hygiene self-test
        run: python -m repolens.security.name_hygiene --self-test

      - name: Name hygiene sentinel proof
        run: |
          token="$(printf '%s%s%s' invented- forbidden- token)"
          python -m repolens.security.name_hygiene --forbidden-name "$token" --require-denylist

      - name: Runtime-configured tracked-tree name hygiene scan
        env:
          REPOLENS_FORBIDDEN_NAMES: ${{ vars.REPOLENS_FORBIDDEN_NAMES }}
        run: |
          if [ -z "$(printf '%s' "$REPOLENS_FORBIDDEN_NAMES" | tr -d '[:space:],')" ]; then
            echo "REPOLENS_FORBIDDEN_NAMES must be configured for tracked-tree name hygiene" >&2
            exit 1
          fi
          python -m repolens.security.name_hygiene --require-denylist

      - name: Watermark canary
        run: python -m repolens.testing.watermark --manifest tests/fixtures/synthetic/fixture_manifest.json

      - name: Verify F4 tool pins
        run: python tools/pins_lint.py src/repolens/bootstrap/pins.toml

      - name: Tool pins
        run: python scripts/ci/verify_tool_pins.py
