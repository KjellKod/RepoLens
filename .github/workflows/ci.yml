name: Offline PR CI

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  offline-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install package and locked dev tools
        run: |
          python -m pip install -e .
          python -m pip install --require-hashes -r requirements-dev.txt

      - name: Ruff format
        run: python -m ruff format --check .

      - name: Ruff lint
        run: python -m ruff check .

      - name: Unit tests
        run: python -m pytest tests/unit

      - name: Integration tests
        run: python -m pytest tests/integration tests/e2e tests/canaries

      - name: Security canaries
        run: python scripts/ci/run_security_canaries.py

      - name: Name hygiene
        run: |
          token="$(printf '%s%s%s' invented- forbidden- token)"
          python scripts/ci/name_hygiene.py --forbidden-name "$token" --require-denylist

      - name: Tool pins
        run: python scripts/ci/verify_tool_pins.py

  security-canaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install package and locked dev tools
        run: |
          python -m pip install -e .
          python -m pip install --require-hashes -r requirements-dev.txt

      - name: Security canaries
        run: python scripts/ci/run_security_canaries.py
