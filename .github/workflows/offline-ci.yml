name: Offline CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install pinned test dependencies
        run: python -m pip install -e ".[test]"

      - name: Lint
        run: python -m ruff check src/repolens/testing tests/conftest.py tests/integration tests/security

      - name: Run offline tests
        run: python -m pytest -m offline

      - name: Run name-hygiene guard
        run: python -m repolens.testing.name_hygiene --root .

      - name: Run watermark canary
        run: python -m repolens.testing.watermark --manifest tests/fixtures/synthetic/fixture_manifest.json

      - name: Lint F4 bootstrap
        run: python -m ruff check src/repolens/bootstrap tools tests/bootstrap

      - name: Verify F4 pins
        run: python tools/pins_lint.py src/repolens/bootstrap/pins.toml

      - name: Run F4 name-hygiene guard
        run: |
          printf '%s%s\n' 'ci-denylist-' 'unused' > "$RUNNER_TEMP/denylist.txt"
          RPL_HYGIENE_DENYLIST_FILE="$RUNNER_TEMP/denylist.txt" \
            python tools/name_hygiene.py src tests docs .github/scripts tools

      - name: Run F4 bootstrap tests
        run: python -m pytest tests/bootstrap
