version: 2

# Philosophy: value, not noise.
#
# Two separate jobs, tuned differently:
#
# 1. SECURITY fixes — handled by Dependabot security updates (alerts-driven, enabled in
#    repo settings). These are NOT governed by the schedule, grouping, or the majors-only
#    filter below: a known vulnerability always gets a PR, even as a patch/minor bump.
#
# 2. VERSION updates (the blocks below) — deliberately quiet. Monthly, grouped into one
#    rollup PR per ecosystem, and limited to MAJOR bumps. Patch/minor churn is ignored —
#    if it is not a security fix and not a major / "this is getting obsolete" move, you
#    will not see a PR. Bump majors when you choose to; don't get pinged for the rest.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"

  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
