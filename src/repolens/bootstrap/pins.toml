# RepoLens tool pins — THE single source of truth for toolchain integrity.
#
# Every entry pins an EXACT version plus a sha256 digest. The string "latest",
# floating specs (*, ^, ~, >=, empty), and base images without an "@sha256:"
# digest are rejected by load_pins() and by tools/pins_lint.py.
#
# Digests are copied from the corresponding upstream release checksum files or
# registry manifest digest. The no-`latest`/no-floating validator and the
# provenance cross-check (manifest hash must equal the signed-checksums entry)
# enforce these values before a downloaded artifact is made executable.

schema = "repolens.pins/v1"

[base_image]
# Pinned by digest, never by tag alone. Tag retained only as a human label.
ref = "docker.io/library/python:3.13-slim@sha256:b04b5d7233d2ad9c379e22ea8927cd1378cd15c60d4ef876c065b25ea8fb3bf3"

# --- Syft: SBOM generator. Verified by checksum + cosign signature. ---
[tools.syft]
version = "1.18.1"
source = "https://github.com/anchore/syft/releases/download/v1.18.1"

[tools.syft.platforms."linux/amd64"]
artifact = "syft_1.18.1_linux_amd64.tar.gz"
sha256 = "066c251652221e4d44fcc4d115ce3df33a91769da38c830a8533199db2f65aab"

[tools.syft.platforms."darwin/arm64"]
artifact = "syft_1.18.1_darwin_arm64.tar.gz"
sha256 = "bc5ad238a7cc60f19459b6f358079847bff5f8e520c8239706730f3fc5c5edd5"

[tools.syft.signature]
mechanism = "cosign-keyless"
checksums_file = "syft_1.18.1_checksums.txt"
checksums_sig = "syft_1.18.1_checksums.txt.sig"
checksums_cert = "syft_1.18.1_checksums.txt.pem"
cert_identity_regex = "https://github.com/anchore/syft/.github/workflows/.*"
cert_oidc_issuer = "https://token.actions.githubusercontent.com"

# --- cosign: used to verify Syft's signature; itself in the trusted base. ---
[tools.cosign]
version = "2.4.1"
source = "https://github.com/sigstore/cosign/releases/download/v2.4.1"

[tools.cosign.platforms."linux/amd64"]
artifact = "cosign-linux-amd64"
sha256 = "8b24b946dd5809c6bd93de08033bcf6bc0ed7d336b7785787c080f574b89249b"

[tools.cosign.platforms."darwin/arm64"]
artifact = "cosign-darwin-arm64"
sha256 = "13343856b69f70388c4fe0b986a31dde5958e444b41be22d785d3dc5e1a9cc62"

# --- ScanCode: deep license detection. Installed via hash-pinned pip. ---
[tools.scancode]
version = "32.3.1"
requirements = "scancode.requirements.txt"  # hash-pinned, consumed with --require-hashes

# --- git / gh: pinned, security-critical CLIs. ---
[tools.git]
version = "2.47.1"
source = "https://mirrors.edge.kernel.org/pub/software/scm/git"

[tools.git.platforms."linux/amd64"]
artifact = "git-2.47.1.tar.gz"
sha256 = "f4c4e98667800585d218dfdf415eb72f73baa7abcac4569e2ce497970f8d6665"

[tools.gh]
version = "2.63.2"
source = "https://github.com/cli/cli/releases/download/v2.63.2"

[tools.gh.platforms."linux/amd64"]
artifact = "gh_2.63.2_linux_amd64.tar.gz"
sha256 = "912fdb1ca29cb005fb746fc5d2b787a289078923a29d0f9ec19a0b00272ded00"
