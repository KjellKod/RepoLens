[tool.pytest.ini_options]
addopts = "--strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "offline: can run without live network or external services",
  "security: exercises security guardrails",
  "canary: mandatory security canary coverage",
  "fixtures: fixture contract tests",
  "name_hygiene: verifies forbidden-name and token hygiene",
]

[build-system]
requires = ["setuptools>=69", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "repolens"
dynamic = ["version"]
description = "CLI foundation for a license disclosure orchestrator."
requires-python = ">=3.13"
dependencies = [
  "defusedxml>=0.7.1",
  "jsonschema==4.26.0",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
# pyproject is the single source for dependency pins; lockfiles derive from it.
# requirements-dev.txt carries the same versions with --require-hashes.
test = [
    "pytest==9.0.3",
    "ruff==0.12.0",
]

[project.scripts]
repolens = "repolens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"repolens.data" = ["schemas/*.json"]
"repolens.policy.data" = ["*.json"]
"repolens.bootstrap" = ["pins.toml", "scancode.requirements.txt"]

[tool.setuptools_scm]
tag_regex = "^(?P<version>\\d+\\.\\d+\\.\\d+)$"
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
version_file = "src/repolens/_version.py"

[tool.ruff]
line-length = 100
# Lint target stays at py311 so PEP 695 (py312+) rewrites are not forced on the
# existing typing helpers; the runtime/CI Python is 3.13.
target-version = "py311"
extend-exclude = [".github/scripts/codex_review.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
