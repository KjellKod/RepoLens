[tool.pytest.ini_options]
addopts = "--strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "offline: can run without live network or external services",
  "security: exercises security guardrails",
  "canary: mandatory security canary coverage",
  "fixtures: fixture contract tests",
  "name_hygiene: verifies forbidden-name and token hygiene",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "repolens"
version = "0.1.0"
description = "CLI foundation for a license disclosure orchestrator."
requires-python = ">=3.11"
dependencies = [
  "defusedxml>=0.7.1",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.5",
    "ruff==0.11.13",
]

[project.scripts]
repolens = "repolens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".github/scripts/codex_review.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
